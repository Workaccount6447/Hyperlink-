
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Royality Hosting </title> - Royal Premium File Hosting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #1e293b;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f1f5f9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
            --glow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--light);
            position: relative;
            overflow-x: hidden;
        }

        .bg-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            filter: blur(40px);
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            border-radius: 50%;
            top: -200px;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: var(--primary-dark);
            border-radius: 50%;
            bottom: -150px;
            left: -100px;
            animation: float 15s ease-in-out infinite reverse;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: var(--primary-light);
            border-radius: 50%;
            top: 50%;
            left: 10%;
            animation: float 25s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--light);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: var(--glow);
        }

        .tagline {
            color: rgba(241, 245, 249, 0.7);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .upload-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 15px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.5);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: var(--glow);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.2);
            transform: scale(1.02);
            box-shadow: var(--glow);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            animation: pulse 2s infinite;
            box-shadow: var(--glow);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        .upload-text {
            margin-bottom: 1rem;
        }

        .upload-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--light);
        }

        .upload-subtitle {
            color: rgba(241, 245, 249, 0.7);
            margin-bottom: 1rem;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .file-list {
            margin-top: 2rem;
        }

        .file-list-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--light);
        }

        .file-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .file-icon {
            width: 60px;
            height: 60px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary-light);
            flex-shrink: 0;
        }

        .file-info {
            flex-grow: 1;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            word-break: break-all;
            color: var(--light);
        }

        .file-meta {
            display: flex;
            gap: 1rem;
            color: rgba(241, 245, 249, 0.7);
            font-size: 0.9rem;
        }

        .file-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-icon {
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .btn-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 1rem;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notification.success .notification-icon {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .notification.error .notification-icon {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .notification-message {
            flex-grow: 1;
        }

        .notification-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--light);
        }

        .notification-text {
            font-size: 0.9rem;
            color: rgba(241, 245, 249, 0.7);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: rgba(241, 245, 249, 0.7);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary-light);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--light);
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.1);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--light);
        }

        .modal-close:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .meta-item:last-child {
            border-bottom: none;
        }

        .meta-label {
            font-weight: 600;
            color: rgba(241, 245, 249, 0.7);
        }

        .meta-value {
            word-break: break-all;
            max-width: 60%;
            color: var(--light);
        }

        .copy-link-container {
            display: flex;
            margin-top: 1rem;
        }

        .copy-link-input {
            flex-grow: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px 0 0 8px;
            padding: 0.5rem 1rem;
            color: var(--light);
            font-family: monospace;
            font-size: 0.9rem;
        }

        .copy-link-button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            padding: 0 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-link-button:hover {
            background: var(--primary-dark);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .logo-icon {
                width: 40px;
                height: 40px;
            }
            
            .upload-area {
                padding: 2rem 1rem;
            }
            
            .file-card {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .file-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 0.5rem;
            }
            
            .notification {
                right: 1rem;
                left: 1rem;
            }
            
            .meta-value {
                max-width: 50%;
            }
        }

        @media (max-width: 480px) {
            .upload-title {
                font-size: 1.2rem;
            }
            
            .upload-subtitle {
                font-size: 0.9rem;
            }
            
            .file-card {
                padding: 1rem;
            }
            
            .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <span>kust-host</span>
            </div>
            <p class="tagline">Premium File Hosting with Unlimited Possibilities</p>
        </header>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">
                    <h2 class="upload-title">Drop your files here</h2>
                    <p class="upload-subtitle">or click to browse (max 50MB)</p>
                </div>
                <button class="upload-button">Choose Files</button>
                <input type="file" id="fileInput" class="file-input" multiple>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="file-list">
                <h3 class="file-list-title">Your Files</h3>
                <div id="fileContainer">
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <p>No files uploaded yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <div class="notification-icon"></div>
        <div class="notification-message">
            <div class="notification-title"></div>
            <div class="notification-text"></div>
        </div>
    </div>

    <div class="modal" id="metaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">File Details</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div id="metaContent"></div>
            <div class="copy-link-container">
                <input type="text" id="copyLinkInput" class="copy-link-input" readonly>
                <button id="copyLinkButton" class="copy-link-button">Copy</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileContainer = document.getElementById('fileContainer');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const notification = document.getElementById('notification');
        const metaModal = document.getElementById('metaModal');
        const modalClose = document.getElementById('modalClose');
        const metaContent = document.getElementById('metaContent');
        const copyLinkInput = document.getElementById('copyLinkInput');
        const copyLinkButton = document.getElementById('copyLinkButton');

        // State
        let uploadedFiles = [];

        // Event Listeners
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        
        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('dragover');
            }, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('dragover');
            }, false);
        });
        
        uploadArea.addEventListener('drop', handleDrop, false);
        
        modalClose.addEventListener('click', () => {
            metaModal.classList.remove('active');
        });
        
        copyLinkButton.addEventListener('click', () => {
            copyLinkInput.select();
            document.execCommand('copy');
            showNotification('success', 'Link Copied', 'The permanent link has been copied to your clipboard.');
        });
        
        // Functions
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }
        
        function handleFileSelect(e) {
            const files = e.target.files;
            handleFiles(files);
        }
        
        function handleFiles(files) {
            ([...files]).forEach(uploadFile);
        }
        
        async function uploadFile(file) {
            // Check file size
            if (file.size > 80 * 1024 * 1024) {
                showNotification('error', 'File too large', 'File exceeds 80MB size limit.');
                return;
            }
            
            // Show progress bar
            progressBar.classList.add('active');
            progressFill.style.width = '0%';
            
            // Create form data
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                // Simulate progress (since we can't track real progress with fetch)
                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += 5;
                    if (progress <= 90) {
                        progressFill.style.width = progress + '%';
                    }
                }, 100);
                
                // Upload file
                const response = await fetch('https://harsh-kamillah-royality-ecca704b.koyeb.app/upload', {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Upload failed');
                }
                
                const data = await response.json();
                
                // Add file to list
                addFileToList(data);
                
                // Show success notification
                showNotification('success', 'Upload successful', file.name + ' has been uploaded.');
                
                // Reset progress bar
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);
                
            } catch (error) {
                console.error('Error uploading file:', error);
                showNotification('error', 'Upload failed', error.message);
                
                // Reset progress bar
                progressBar.classList.remove('active');
                progressFill.style.width = '0%';
            }
        }
        
        function addFileToList(fileData) {
            // Remove empty state if it exists
            const emptyState = fileContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            
            // Determine file icon based on content type
            let fileIcon = '📄';
            if (fileData.content_type.startsWith('image/')) {
                fileIcon = '🖼️';
            } else if (fileData.content_type.startsWith('video/')) {
                fileIcon = '🎬';
            } else if (fileData.content_type.startsWith('audio/')) {
                fileIcon = '🎵';
            } else if (fileData.content_type.includes('pdf')) {
                fileIcon = '📕';
            } else if (fileData.content_type.includes('zip') || fileData.content_type.includes('rar')) {
                fileIcon = '🗜️';
            }
            
            // Format file size
            const formattedSize = formatFileSize(fileData.size);
            
            // Create file card
            const fileCard = document.createElement('div');
            fileCard.className = 'file-card';
            fileCard.innerHTML = 
                '<div class="file-icon">' + fileIcon + '</div>' +
                '<div class="file-info">' +
                    '<div class="file-name">' + fileData.filename + '</div>' +
                    '<div class="file-meta">' +
                        '<span>' + formattedSize + '</span>' +
                        '<span>' + new Date().toLocaleDateString() + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="file-actions">' +
                    '<button class="btn btn-primary" data-id="' + fileData.id + '" data-action="download"><span class="btn-icon">⬇</span> Download</button>' +
                    '<button class="btn btn-success" data-id="' + fileData.id + '" data-action="copy"><span class="btn-icon">🔗</span> Copy Link</button>' +
                    '<button class="btn btn-secondary" data-id="' + fileData.id + '" data-action="details"><span class="btn-icon">ℹ</span> Details</button>' +
                '</div>';
            
            // Add event listeners to buttons
            const downloadBtn = fileCard.querySelector('[data-action="download"]');
            const copyBtn = fileCard.querySelector('[data-action="copy"]');
            const detailsBtn = fileCard.querySelector('[data-action="details"]');
            
            downloadBtn.addEventListener('click', () => {
                window.open('https://image-backend-kust11-aa3f313d8bed.herokuapp.com' + fileData.url, '_blank');
            });
            
            copyBtn.addEventListener('click', () => {
                const permanentLink = window.location.origin + '/f/' + fileData.id;
                copyToClipboard(permanentLink);
            });
            
            detailsBtn.addEventListener('click', () => {
                showFileDetails(fileData.id);
            });
            
            // Add to container
            fileContainer.appendChild(fileCard);
            
            // Add to state
            uploadedFiles.push(fileData);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function showNotification(type, title, text) {
            const icon = type === 'success' ? '✓' : '✕';
            
            notification.className = 'notification ' + type;
            notification.querySelector('.notification-icon').textContent = icon;
            notification.querySelector('.notification-title').textContent = title;
            notification.querySelector('.notification-text').textContent = text;
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }
        
        function copyToClipboard(text) {
            // Create a temporary textarea element
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Prevent scrolling to bottom
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                // Try to copy using the newer Clipboard API first
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        showNotification('success', 'Link Copied', 'The permanent link has been copied to your clipboard.');
                    }).catch(err => {
                        console.error('Could not copy text: ', err);
                        fallbackCopyTextToClipboard(text);
                    });
                } else {
                    // Fallback for older browsers
                    fallbackCopyTextToClipboard(text);
                }
            } catch (err) {
                console.error('Could not copy text: ', err);
                fallbackCopyTextToClipboard(text);
            }
            
            // Remove the temporary textarea
            document.body.removeChild(textarea);
        }
        
        function fallbackCopyTextToClipboard(text) {
            document.execCommand('copy');
            showNotification('success', 'Link Copied', 'The permanent link has been copied to your clipboard.');
        }
        
        async function showFileDetails(fileId) {
            try {
                const response = await fetch('https://image-backend-kust11-aa3f313d8bed.herokuapp.com/meta/' + fileId);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to fetch file metadata');
                }
                
                const metadata = await response.json();
                
                // Set the permanent link
                const permanentLink = window.location.origin + '/f/' + fileId;
                copyLinkInput.value = permanentLink;
                
                // Format metadata for display
                metaContent.innerHTML = 
                    '<div class="meta-item">' +
                        '<div class="meta-label">File ID</div>' +
                        '<div class="meta-value">' + metadata.file_id + '</div>' +
                    '</div>' +
                    '<div class="meta-item">' +
                        '<div class="meta-label">Filename</div>' +
                        '<div class="meta-value">' + metadata.filename + '</div>' +
                    '</div>' +
                    '<div class="meta-item">' +
                        '<div class="meta-label">Content Type</div>' +
                        '<div class="meta-value">' + metadata.content_type + '</div>' +
                    '</div>' +
                    '<div class="meta-item">' +
                        '<div class="meta-label">File Size</div>' +
                        '<div class="meta-value">' + formatFileSize(metadata.size) + '</div>' +
                    '</div>' +
                    '<div class="meta-item">' +
                        '<div class="meta-label">S3 Key</div>' +
                        '<div class="meta-value">' + metadata.s3_key + '</div>' +
                    '</div>';
                
                metaModal.classList.add('active');
                
            } catch (error) {
                console.error('Error fetching file metadata:', error);
                showNotification('error', 'Error', error.message);
            }
        }
