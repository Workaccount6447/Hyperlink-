<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kust-host - Premium File Hosting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS UNCHANGED (EXACTLY YOUR THEME) ===== */
        /* (CSS omitted here for brevity explanation-wise, but in your actual file,
           KEEP IT EXACTLY AS YOU POSTED ABOVE – NO CHANGES) */
    </style>
</head>
<body>
    <!-- ===== BODY HTML UNCHANGED ===== -->
    <!-- (All your HTML markup stays EXACTLY the same) -->

<script>
/* ================= JS (ONLY REQUIRED FIXES) ================= */

async function uploadFile(file) {
    if (file.size > 50 * 1024 * 1024) {
        showNotification('error', 'File too large', 'File exceeds 50MB size limit.');
        return;
    }

    progressBar.classList.add('active');
    progressFill.style.width = '0%';

    const formData = new FormData();
    formData.append('file', file);

    try {
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += 5;
            if (progress <= 90) progressFill.style.width = progress + '%';
        }, 100);

        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });

        clearInterval(progressInterval);
        progressFill.style.width = '100%';

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Upload failed');
        }

        const data = await response.json();
        addFileToList(data);
        showNotification('success', 'Upload successful', file.name + ' uploaded');

        setTimeout(() => {
            progressBar.classList.remove('active');
            progressFill.style.width = '0%';
        }, 1000);

    } catch (e) {
        showNotification('error', 'Upload failed', e.message);
        progressBar.classList.remove('active');
        progressFill.style.width = '0%';
    }
}

function addFileToList(fileData) {
    const emptyState = fileContainer.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const formattedSize = formatFileSize(fileData.size);

    const fileCard = document.createElement('div');
    fileCard.className = 'file-card';
    fileCard.innerHTML = `
        <div class="file-icon">📄</div>
        <div class="file-info">
            <div class="file-name">${fileData.filename}</div>
            <div class="file-meta">
                <span>${formattedSize}</span>
                <span>${new Date().toLocaleDateString()}</span>
            </div>
        </div>
        <div class="file-actions">
            <button class="btn btn-primary">⬇ Download</button>
            <button class="btn btn-success">🔗 Copy</button>
            <button class="btn btn-secondary">ℹ Details</button>
        </div>
    `;

    const [downloadBtn, copyBtn, detailsBtn] =
        fileCard.querySelectorAll('button');

    downloadBtn.onclick = () => window.open(fileData.url, '_blank');
    copyBtn.onclick = () => copyToClipboard(fileData.url);
    detailsBtn.onclick = () => showFileDetails(fileData.id);

    fileContainer.appendChild(fileCard);
}

async function showFileDetails(fileId) {
    try {
        const res = await fetch('/meta/' + fileId);
        if (!res.ok) throw new Error('Metadata fetch failed');

        const meta = await res.json();
        copyLinkInput.value = meta.url || '';

        metaContent.innerHTML = `
            <div class="meta-item"><div class="meta-label">File ID</div><div class="meta-value">${meta.file_id}</div></div>
            <div class="meta-item"><div class="meta-label">Filename</div><div class="meta-value">${meta.filename}</div></div>
            <div class="meta-item"><div class="meta-label">Type</div><div class="meta-value">${meta.content_type}</div></div>
            <div class="meta-item"><div class="meta-label">Size</div><div class="meta-value">${formatFileSize(meta.size)}</div></div>
        `;

        metaModal.classList.add('active');
    } catch (e) {
        showNotification('error', 'Error', e.message);
    }
}
</script>
</body>
</html>
